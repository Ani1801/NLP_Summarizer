# Render.com Deployment Blueprint
# Deploy at: https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: auditor-ai-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: "auditor_ai"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: "legal-docs"
      - key: PINECONE_HOST
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUMMARY_PROVIDER
        value: "gemini"
      - key: SUMMARIZATION_USE_INSTRUCTION
        value: "true"
      - key: SUMMARIZATION_DEVICE
        value: "cpu"

  # Frontend (Static Site on Render - or deploy to Vercel)
  - type: web
    name: auditor-ai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: auditor-ai-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
